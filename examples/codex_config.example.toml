# Add to ~/.codex/config.toml (Codex CLI global config).
# Install the command first:
#   uv tool install git+https://github.com/Echo722/reaper-mcp-bridge
#
# Only set REAPER_MCP_BRIDGE_DIR if you moved the bridge data dir; by default
# `reaper-mcp-bridge install-bridge` records the location automatically.

[mcp_servers.reaper]
command = "reaper-mcp-bridge"

# [mcp_servers.reaper.env]
# REAPER_MCP_BRIDGE_DIR = 'D:\custom\bridge\dir'
